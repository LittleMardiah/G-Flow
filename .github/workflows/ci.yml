name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force all jobs to run regardless of path changes'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------- Detect path changes ----------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      landing: ${{ steps.filter.outputs.landing }}
      flutter: ${{ steps.filter.outputs.flutter }}
      customer_app: ${{ steps.filter.outputs.customer_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
            landing:
              - 'apps/landing_page/**'
            flutter:
              - 'apps/customer_app/**'
              - 'apps/driver_app/**'
              - 'apps/merchant_app/**'
            customer_app:
              - 'apps/customer_app/**'

  # ---------- Go Backend ----------
  go-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download deps
        run: go mod download
      - name: Verify deps
        run: go mod verify
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (with coverage)
        run: |
          go test -short -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.log
          go tool cover -func=coverage.out | tail -1
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
            echo "## Go Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Go Coverage: N/A (no coverage.out found)" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            test-output.log

  # ---------- Go Security Scan ----------
  go-security:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

  # ---------- Landing Page (Next.js) ----------
  landing-page:
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/landing_page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing_page/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Audit (high severity only)
        run: npm audit --audit-level=high || true
      - name: Build
        run: npm run build
      - name: Bundle size check
        if: always()
        run: |
          if [ -d .next ]; then
            SIZE=$(du -sb .next/ | awk '{print $1}')
            THRESHOLD=512000
            echo "## Next.js Bundle Size" >> $GITHUB_STEP_SUMMARY
            echo "- Size: ${SIZE} bytes ($(( SIZE / 1024 )) KB)" >> $GITHUB_STEP_SUMMARY
            echo "- Threshold: ${THRESHOLD} bytes ($(( THRESHOLD / 1024 )) KB)" >> $GITHUB_STEP_SUMMARY
            if [ "$SIZE" -gt "$THRESHOLD" ]; then
              echo "- WARNING: Bundle exceeds threshold (non-blocking)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- OK: Bundle within threshold" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## Next.js Bundle Size" >> $GITHUB_STEP_SUMMARY
            echo "- Skipped: .next/ directory not found" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------- Flutter Apps (matrix: 3 apps) ----------
  flutter:
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, driver_app, merchant_app]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
        continue-on-error: true

  # ---------- Flutter Build Test (customer_app only) ----------
  flutter-build:
    needs: changes
    if: ${{ needs.changes.outputs.customer_app == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug --target-platform android-arm64

  # ---------- CI Gate (final status) ----------
  ci-gate:
    if: always()
    needs: [go-backend, go-security, landing-page, flutter, flutter-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check all jobs status
        run: |
          echo "go-backend: ${{ needs.go-backend.result }}"
          echo "go-security: ${{ needs.go-security.result }}"
          echo "landing-page: ${{ needs.landing-page.result }}"
          echo "flutter: ${{ needs.flutter.result }}"
          echo "flutter-build: ${{ needs.flutter-build.result }}"
          if [[ "${{ needs.go-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.landing-page.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
      - name: Notify on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\":x: CI Failed: ${{ github.repository }} @ ${{ github.ref_name }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
