name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force all jobs to run regardless of path changes'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      landing: ${{ steps.filter.outputs.landing }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
      flutter: ${{ steps.filter.outputs.flutter }}
      customer_app: ${{ steps.filter.outputs.customer_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
            landing:
              - 'apps/landing_page/**'
            admin_web:
              - 'apps/admin_web/**'
            flutter:
              - 'apps/customer_app/**'
              - 'apps/driver_app/**'
              - 'apps/merchant_app/**'
            customer_app:
              - 'apps/customer_app/**'

  go-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download deps
        run: go mod download
      - name: Verify deps
        run: go mod verify
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (with coverage)
        run: |
          go test -short -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.log
          go tool cover -func=coverage.out | tail -1
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
            echo "## Go Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Go Coverage: N/A (no coverage.out found)" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            test-output.log

  go-security:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

  landing-page:
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/landing_page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing_page/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Audit (high severity only)
        run: npm audit --audit-level=high || true
      - name: Build
        run: npm run build
      - name: Bundle size check
        if: always()
        run: |
          if [ -d .next ]; then
            SIZE=$(du -sb .next/ | awk '{print $1}')
            THRESHOLD=512000
            echo "## Next.js Bundle Size" >> $GITHUB_STEP_SUMMARY
            echo "- Size: ${SIZE} bytes ($(( SIZE / 1024 )) KB)" >> $GITHUB_STEP_SUMMARY
            echo "- Threshold: ${THRESHOLD} bytes ($(( THRESHOLD / 1024 )) KB)" >> $GITHUB_STEP_SUMMARY
            if [ "$SIZE" -gt "$THRESHOLD" ]; then
              echo "- WARNING: Bundle exceeds threshold (non-blocking)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- OK: Bundle within threshold" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## Next.js Bundle Size" >> $GITHUB_STEP_SUMMARY
            echo "- Skipped: .next/ directory not found" >> $GITHUB_STEP_SUMMARY
          fi

  e2e-landing:
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing_page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing_page/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/landing_page/playwright-report/
          retention-days: 7

  e2e-admin:
    needs: changes
    if: ${{ needs.changes.outputs.admin_web == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: g_flow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/g_flow_e2e
      REDIS_URL: redis://localhost:6379/15
      PORT: '8080'
      ENV: test
      JWT_SECRET: gflow-e2e-admin-jwt-secret-2026-change-before-prod
      ADMIN_2FA_SECRET: gflow-e2e-admin-2fa-secret-min-32-chars-2026
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      E2E_ADMIN_EMAIL: admin@g-flow.local
      E2E_ADMIN_PASSWORD: AdminP@ssw0rd!2026
    defaults:
      run:
        working-directory: apps/admin_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin_web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply migrations + seed admin
        working-directory: .
        run: |
          for f in migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "Applied migrations: $(ls migrations/*.up.sql | wc -l)"
      - name: Start backend
        working-directory: .
        run: |
          go build -o /tmp/gflow-api ./cmd/api
          /tmp/gflow-api > /tmp/gflow-api.log 2>&1 &
          echo "gflow_api_pid=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/ready >/dev/null 2>&1; then
              echo "Backend ready after ${i}0s"
              exit 0
            fi
            sleep 2
          done
          echo "=== backend log ==="
          cat /tmp/gflow-api.log
          exit 1
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin-web
          path: apps/admin_web/playwright-report/
          retention-days: 7

  flutter:
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, driver_app, merchant_app]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
        continue-on-error: true

  flutter-build:
    needs: changes
    if: ${{ needs.changes.outputs.customer_app == 'true' || github.event_name == 'pull_request' || github.event.inputs.force_all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug --target-platform android-arm64

  ci-gate:
    if: always()
    needs: [go-backend, go-security, landing-page, e2e-landing, e2e-admin, flutter, flutter-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check all jobs status
        run: |
          echo "go-backend: ${{ needs.go-backend.result }}"
          echo "go-security: ${{ needs.go-security.result }}"
          echo "landing-page: ${{ needs.landing-page.result }}"
          echo "e2e-landing: ${{ needs.e2e-landing.result }}"
          echo "e2e-admin: ${{ needs.e2e-admin.result }}"
          echo "flutter: ${{ needs.flutter.result }}"
          echo "flutter-build: ${{ needs.flutter-build.result }}"
          if [[ "${{ needs.go-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.landing-page.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-landing.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-admin.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
      - name: Notify on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\":x: CI Failed: ${{ github.repository }} @ ${{ github.ref_name }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
